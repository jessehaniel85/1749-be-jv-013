spring:
  jpa:
    hibernate:
      ddl-auto: update
    # schema.sql e data.sql (tabela alunos) rodam depois que o Hibernate cria as tabelas (users)
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

resilience4j:
  ratelimiter:
    instances:
      alunoService:
        limitForPeriod: 1
        limitRefreshPeriod: 10s
        # 0s: a segunda chamada falha na hora (com 5s ela esperaria até 5 segundos por uma vaga)
        timeoutDuration: 0s

app:
  demo:
    # ATENÇÃO: chave de DEMONSTRAÇÃO da aula 03, com valor padrão. Em um sistema real a chave
    # NUNCA fica no repositório (na aula 08, o JWT do projeto usa ${JWT_SECRET} sem valor padrão).
    jwt-secret: ${JWT_DEMO_SECRET:chave-de-demonstracao-da-aula-03-nao-use-em-producao}
