<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Você saiu</title>
  <link rel="stylesheet" th:href="@{/estilo.css}">
</head>
<body>
<header><h1>Login único da escola <small>· provedor de identidade</small></h1></header>
<main>
  <div class="cartao">
    <h2>Você saiu de todos os sistemas</h2>
    <p>A sessão no provedor foi encerrada e as aplicações foram avisadas.</p>
    <p class="acoes">
      <!-- o endereço vem do CADASTRO da aplicação, não da URL -->
      <a class="botao" th:if="${aplicacao != null}" th:href="${aplicacao.urlPosLogout()}"
         th:text="'Voltar para ' + ${aplicacao.nome()}">Voltar</a>
      <a class="botao secundario" th:href="@{/}">Entrar de novo</a>
    </p>
  </div>
</main>
</body>
</html>
